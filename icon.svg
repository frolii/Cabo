<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="boxGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65B741"/>
      <stop offset="100%" stop-color="#3E8E2E"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Outer Card in Friendly Cabo Box Green -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#boxGreen)"/>
  
  <!-- Subtle Cabo Box Scale Pattern -->
  <g stroke="#2F6F21" stroke-width="5" fill="none" opacity="0.28">
    <path d="M60,110 Q110,150 160,110 Q210,150 260,110 Q310,150 360,110 Q410,150 460,110"/>
    <path d="M60,190 Q110,230 160,190 Q210,230 260,190 Q310,230 360,190 Q410,230 460,190"/>
    <path d="M60,270 Q110,310 160,270 Q210,310 260,270 Q310,310 360,270 Q410,310 460,270"/>
  </g>

  <!-- Inner Bright Cream Card -->
  <rect x="64" y="56" width="384" height="400" rx="56" fill="#FFFFFF" stroke="#FEF08A" stroke-width="8"/>

  <!-- Rainbow Arc -->
  <path d="M 380 436 A 150 150 0 0 0 180 280" fill="none" stroke="url(#rainbow)" stroke-width="36" stroke-linecap="round" opacity="0.85"/>

  <!-- 0 Corner Number -->
  <text x="104" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="900" fill="#4D9B36">0</text>

  <!-- Unicorn Silhouette -->
  <path d="M 150 448 C 158 355 184 295 212 240 L 194 210 C 190 200 202 192 218 205 L 236 216 C 260 206 286 218 306 244 L 338 292 C 350 310 340 335 318 332 C 298 330 284 318 272 308 C 264 344 274 396 288 448 Z" fill="#1E293B"/>
  
  <!-- Golden Horn -->
  <polygon points="248,218 352,102 280,240" fill="url(#horn)"/>
  <circle cx="280" cy="260" r="6" fill="#FFFFFF"/>

  <!-- CABO Red/Gold Badge inspired by the original box logo -->
  <rect x="136" y="364" width="240" height="68" rx="22" fill="#E11D48" stroke="#FDE047" stroke-width="7"/>
  <text x="256" y="411" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="5" fill="#FEF08A">CABO</text>
</svg>
