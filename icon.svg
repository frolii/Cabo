<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="32" y="16" width="448" height="480" rx="56" fill="url(#bg)" stroke="url(#rainbow)" stroke-width="12"/>
  
  <!-- Rainbow Arc -->
  <path d="M 380 484 A 180 180 0 0 0 180 320" fill="none" stroke="url(#rainbow)" stroke-width="44" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Corner Indices (0) -->
  <text x="80" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#F8FAFC" opacity="0.9">0</text>
  <text x="432" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#F8FAFC" opacity="0.9" transform="rotate(180 412 396)">0</text>

  <!-- Surreal Clouds & Stars -->
  <circle cx="140" cy="180" r="5" fill="#FDE047" opacity="0.8"/>
  <circle cx="380" cy="120" r="7" fill="#A855F7" opacity="0.8"/>
  <circle cx="400" cy="230" r="4" fill="#38BDF8" opacity="0.8"/>

  <!-- Unicorn Head & Neck Silhouette (Cabo 0 Card Motif) -->
  <path d="M 136 484 C 145 380 175 310 205 250 L 185 215 C 180 205 195 195 212 210 L 232 222 C 258 212 288 225 310 255 L 348 310 C 362 330 350 358 326 355 C 304 352 288 338 274 328 C 266 368 276 425 292 484 Z" fill="#F8FAFC" filter="url(#glow)"/>
  
  <!-- Unicorn Horn -->
  <polygon points="248,225 365,95 282,250" fill="url(#horn)" filter="url(#glow)"/>
  
  <!-- Unicorn Eye & Nostril -->
  <circle cx="282" cy="272" r="7" fill="#121824"/>
  <circle cx="332" cy="332" r="4.5" fill="#94A3B8"/>
  
  <!-- CABO Badge -->
  <rect x="136" y="392" width="240" height="64" rx="20" fill="#121824" fill-opacity="0.88" stroke="#F59E0B" stroke-width="4"/>
  <text x="256" y="436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="6" fill="#FDE047">CABO</text>
</svg>
