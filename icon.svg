<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE0"/>
      <stop offset="100%" stop-color="#E6D5B8"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Vintage Book Page Base -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#parchment)" stroke="#C8B28E" stroke-width="10"/>
  <!-- Fine Double Inner Border -->
  <rect x="48" y="48" width="416" height="416" rx="72" fill="none" stroke="#B09772" stroke-width="3.5" stroke-dasharray="1 0"/>
  <rect x="60" y="60" width="392" height="392" rx="64" fill="none" stroke="#D1BE9C" stroke-width="2"/>

  <!-- Delicate Spy Glasses Illustration (like Card 9) -->
  <g stroke="#5C4433" stroke-width="8" fill="none" stroke-linecap="round">
    <circle cx="190" cy="195" r="46" fill="#EFE3CC" fill-opacity="0.6"/>
    <circle cx="322" cy="195" r="46" fill="#EFE3CC" fill-opacity="0.6"/>
    <path d="M 236 195 Q 256 178 276 195"/>
    <path d="M 125 190 L 144 195"/>
    <path d="M 368 195 L 387 190"/>
  </g>

  <!-- Flowing Script Title "Cabo" (like Peek / Spy / Swap on the cards) -->
  <text x="256" y="345" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="112" font-weight="400" fill="#2C1E14">Cabo</text>
  
  <!-- Ornamental Flourish Underline -->
  <path d="M 130 385 Q 256 415 382 385" fill="none" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="399" r="6" fill="#B45309"/>
</svg>
